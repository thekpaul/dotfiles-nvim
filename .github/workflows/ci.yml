name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Luacheck
        run: sudo apt-get update && sudo apt-get install -y lua-check
      - name: Luacheck
        run: luacheck .
      - uses: prefix-dev/setup-pixi@v0
        with:
          run-install: false
      - name: StyLua
        run: pixi exec stylua --check .

  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # nvim-treesitter's frozen master branch supports CLI 0.25.x;
          # its rewritten main branch requires CLI 0.26.1 or newer.
          - nvim: "nvim=0.11.*"
            tree_sitter: "tree-sitter-cli=0.25.*"
          - nvim: "nvim=0.12.*"
            tree_sitter: "tree-sitter-cli>=0.26.1"
          - nvim: "nvim>=0.11"
            tree_sitter: "tree-sitter-cli>=0.26.1"
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0
        with:
          run-install: false
      - name: Run check harness
        env:
          NVIM_CHECK_FULL: "1"
        run: >-
          pixi exec
          --spec '${{ matrix.nvim }}'
          --spec '${{ matrix.tree_sitter }}'
          --spec c-compiler
          -- bash tests/run-checks.sh
